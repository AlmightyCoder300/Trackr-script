name: Internship Monitor

on:
  schedule:
    # 07:30 UTC every weekday (Mon–Fri)
    - cron: "30 7 * * 1-5"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write  # needed to commit the updated snapshot

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Fetch the full history so we can commit back
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Run monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python monitor.py

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          # Only commit if the snapshot actually changed
          git diff --cached --quiet || git commit -m "chore: update snapshot $(date -u +%Y-%m-%d)"
          git push
